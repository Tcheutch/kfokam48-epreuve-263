# Les tests tournent sur une machine sans base de données (contrainte B6, ENF7).
# H2 en mémoire, en mode PostgreSQL, et les MÊMES migrations Flyway qu'en
# production : c'est la seule façon de tester le schéma réellement livré.
spring:
  datasource:
    url: jdbc:h2:mem:kfokam48;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Sans db/demo : un test doit partir d'une base vide et poser lui-même
    # les données dont il parle.
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
